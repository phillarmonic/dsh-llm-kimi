[project]
site_url = "https://phillarmonic.github.io/dsh-llm-kimi/"
site_name = "Kimi connector for DeepSeek Harness"
site_description = "Official documentation for @phillarmonic/dsh-llm-kimi, a Kimi K3 (Moonshot) connector plugin for the DeepSeek Harness llm capability seam: streaming chat completions, reasoning effort, and image input."
site_author = "Phillarmonic Software"

copyright = "Copyright &copy; 2026 Phillarmonic Software"

repo_url = "https://github.com/phillarmonic/dsh-llm-kimi"
repo_name = "phillarmonic/dsh-llm-kimi"
edit_uri = "edit/main/docs/"

extra_css = [
  "assets/components/mermaid-panzoom/styles.css",
]
extra_javascript = [
  { path = "assets/components/mermaid-panzoom/index.js", type = "module" },
]

nav = [
  { "Overview" = "index.md" },
  { "Installation" = "installation.md" },
  { "Configuration" = "configuration.md" },
  { "Models" = "models.md" },
  { "Image input" = "image-input.md" },
  { "Behavior and limits" = "behavior.md" },
  { "Development" = "development.md" },
]

[project.theme]
name = "material"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/bot"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/phillarmonic/dsh-llm-kimi"

[[project.extra.social]]
icon = "fontawesome/brands/npm"
link = "https://www.npmjs.com/package/@phillarmonic/dsh-llm-kimi"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.validation]
invalid_links = true
invalid_link_anchors = true
